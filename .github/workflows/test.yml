name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # One runner per pull request: Ubuntu with Python 3.12. macOS and Python 3.9 are checked locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/test_rotation.py
      - run: python tests/package_smoke.py
